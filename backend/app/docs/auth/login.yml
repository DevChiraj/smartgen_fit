tags:
  - Auth
summary: Log in with username or email
consumes:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Username or email
        password:
          type: string
          format: password
responses:
  200:
    description: Authenticated
    schema:
      type: object
      properties:
        user:
          $ref: '#/definitions/UserPublic'
        access_token:
          type: string
        refresh_token:
          type: string
  400:
    description: Validation error (missing fields)
  401:
    description: Invalid username/email or password
