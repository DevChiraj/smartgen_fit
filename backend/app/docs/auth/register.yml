tags:
  - Auth
summary: Register a new account
description: Validates age >= 15 server-side (rule 4), hashes the password with bcrypt, and returns JWT access + refresh tokens alongside the created user.
consumes:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [full_name, date_of_birth, gender, email, username, password]
      properties:
        full_name:
          type: string
          example: Jane Silva
        date_of_birth:
          type: string
          format: date
          example: "2000-05-14"
        gender:
          type: string
          enum: [male, female, other]
        email:
          type: string
          format: email
        phone_number:
          type: string
        height_cm:
          type: number
        weight_kg:
          type: number
        username:
          type: string
          description: 3-50 chars, letters/numbers/underscore only
        password:
          type: string
          format: password
          description: Minimum 8 characters
responses:
  201:
    description: Account created
    schema:
      type: object
      properties:
        user:
          $ref: '#/definitions/UserPublic'
        access_token:
          type: string
        refresh_token:
          type: string
  400:
    description: Validation error (missing/invalid fields, or under minimum age)
  409:
    description: Email or username already registered
definitions:
  UserPublic:
    type: object
    properties:
      user_id:
        type: integer
      full_name:
        type: string
      username:
        type: string
      email:
        type: string
      gender:
        type: string
      age:
        type: integer
      phone_number:
        type: string
      height_cm:
        type: string
      weight_kg:
        type: string
      profile_picture_url:
        type: string
      role:
        type: string
        enum: [user, admin]
      created_at:
        type: string
        format: date-time
