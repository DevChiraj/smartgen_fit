tags:
  - Workout Logs
summary: Log a completed workout against a real exercise
description: >
  Ties the log entry to a real exercises row (no free-text exercise names).
  If calories_burned is omitted, it's derived from the exercise's
  calories_per_30min reference rate and the duration performed. If log_date
  is omitted, it defaults to today.
security:
  - BearerAuth: []
consumes:
  - application/json
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [exercise_id, duration_minutes]
      properties:
        exercise_id:
          type: integer
        log_date:
          type: string
          format: date
          example: "2026-08-09"
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 600
        calories_burned:
          type: integer
          minimum: 0
          maximum: 5000
        notes:
          type: string
          maxLength: 255
responses:
  201:
    description: Logged
    schema:
      type: object
      properties:
        log:
          $ref: '#/definitions/WorkoutLog'
  400:
    description: Missing/invalid fields
  401:
    description: Missing/invalid/expired access token
  404:
    description: No exercise with that id
definitions:
  WorkoutLog:
    type: object
    properties:
      log_id:
        type: integer
      log_date:
        type: string
        format: date
      duration_minutes:
        type: integer
      calories_burned:
        type: integer
      notes:
        type: string
      created_at:
        type: string
        format: date-time
      exercise:
        type: object
        properties:
          exercise_id:
            type: integer
          exercise_name:
            type: string
          target_muscle:
            type: string
