tags:
  - Admin
summary: Update an exercise
description: Partial update.
security:
  - BearerAuth: []
consumes:
  - application/json
parameters:
  - in: path
    name: exercise_id
    type: integer
    required: true
  - in: body
    name: body
    schema:
      type: object
      properties:
        exercise_name:
          type: string
        target_muscle:
          type: string
        difficulty:
          type: string
          enum: [Beginner, Intermediate, Advanced]
        equipment:
          type: string
        sets:
          type: integer
        reps:
          type: integer
        calories_per_30min:
          type: integer
        benefit:
          type: string
responses:
  200:
    description: Updated
    schema:
      type: object
      properties:
        exercise:
          $ref: '#/definitions/Exercise'
  400:
    description: Validation error
  401:
    description: Missing/invalid/expired access token
  403:
    description: Not an admin
  404:
    description: No exercise with that id
