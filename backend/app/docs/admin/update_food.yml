tags:
  - Admin
summary: Update a food
description: Partial update.
security:
  - BearerAuth: []
consumes:
  - application/json
parameters:
  - in: path
    name: food_id
    type: integer
    required: true
  - in: body
    name: body
    schema:
      type: object
      properties:
        food_name:
          type: string
        category:
          type: string
        serving_size:
          type: string
        calories:
          type: integer
        protein_g:
          type: number
        carbs_g:
          type: number
        fat_g:
          type: number
        fiber_g:
          type: number
        vitamins:
          type: string
        minerals:
          type: string
        image_url:
          type: string
responses:
  200:
    description: Updated
    schema:
      type: object
      properties:
        food:
          $ref: '#/definitions/SriLankanFood'
  400:
    description: Validation error
  401:
    description: Missing/invalid/expired access token
  403:
    description: Not an admin
  404:
    description: No food with that id
