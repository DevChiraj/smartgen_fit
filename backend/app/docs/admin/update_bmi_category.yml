tags:
  - Admin
summary: Update a BMI category
description: Partial update.
security:
  - BearerAuth: []
consumes:
  - application/json
parameters:
  - in: path
    name: bmi_category_id
    type: integer
    required: true
  - in: body
    name: body
    schema:
      type: object
      properties:
        category_name:
          type: string
        min_bmi:
          type: number
        max_bmi:
          type: number
responses:
  200:
    description: Updated
    schema:
      type: object
      properties:
        bmi_category:
          $ref: '#/definitions/BMICategory'
  400:
    description: Validation error
  401:
    description: Missing/invalid/expired access token
  403:
    description: Not an admin
  404:
    description: No BMI category with that id
