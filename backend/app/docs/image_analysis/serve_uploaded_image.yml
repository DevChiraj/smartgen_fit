tags:
  - Image Analysis
summary: Fetch an uploaded body photo file
description: Public - same trade-off as profile pictures, see module_reports/module10.md.
parameters:
  - in: path
    name: filename
    type: string
    required: true
produces:
  - image/png
  - image/jpeg
  - image/webp
responses:
  200:
    description: The image file
  404:
    description: No such file
